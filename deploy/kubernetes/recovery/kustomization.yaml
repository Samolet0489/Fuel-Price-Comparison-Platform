apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../simulation
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus
        namespace: fuel-stop
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: fuel-stop
