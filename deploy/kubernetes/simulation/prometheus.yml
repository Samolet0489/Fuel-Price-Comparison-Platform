global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: placement-simulator
    static_configs:
      - targets: [fuel-stop-simulation:8010]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: fuel-stop-workers
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [fuel-stop]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: fuel-stop-worker
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '8000'
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
